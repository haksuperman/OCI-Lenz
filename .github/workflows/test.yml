name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: oci-lenz sample --output /tmp/oci-sample
      - run: oci-lenz draw --snapshot /tmp/oci-sample/snapshot.json --output /tmp/oci-output --no-ai --no-png
