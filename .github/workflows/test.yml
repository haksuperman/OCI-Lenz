name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - name: Installed package smoke test outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          oci-lenz sample --output oci-sample
          oci-lenz draw --snapshot oci-sample/snapshot.json --output oci-output --no-ai --no-png
          python -c "from oci_lenz.draw import ROOT; assert (ROOT / '.agents/skills/drawio/SKILL.md').is_file(); assert (ROOT / 'assets/reference/layout-guide.png').is_file()"
